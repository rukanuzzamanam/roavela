      <stop offset="0" stop-color="#0f2a22"/>
      <stop offset="0.45" stop-color="#2c5a4a"/>
      <stop offset="0.72" stop-color="#d98a52"/>
      <stop offset="0.86" stop-color="#f3c08e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.5" stop-color="#f8cf94" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3a86a" stop-opacity="0"/>
